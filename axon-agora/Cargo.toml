[package]
name = "axon-agora"
version = "0.1.2"
edition = "2021"
rust-version = "1.95"
authors = ["AXON Project", "Ricardo Velit"]
description = "The first official library of axon-lang: governed native connectors for LinkedIn, Facebook Pages, Instagram, and TikTok. OSS protocol layer — capability×scope matrix, session-typed publishing protocols, owned-only posture refusals, and consumable posting quotas. Founded on papers/paper_axon_agora.md."
license = "AGPL-3.0-or-later"
repository = "https://github.com/VelitRicardo/axon-lang"
readme = "README.md"
keywords = ["axon", "agent", "social", "connector", "governance"]
categories = ["api-bindings", "web-programming"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The native connector cores do real HTTPS against the platforms'
# official APIs. Blocking (the runtime isolates dispatch in spawn_blocking,
# Brief #63); rustls (no OpenSSL); same flag shape as axon-rs.
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }

# ─── target/ bloat control (disk hygiene, same as axon-frontend/axon-rs) ───
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0
