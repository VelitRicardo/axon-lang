name: v1.32.0 — The Request Binding Contract

# v1.32.0 (D7, D5) — Dedicated CI workflow exercising the full
# Request Binding Contract surface on every PR + master push. D1–D7
# ratificadas 2026-05-18; this workflow locks the contract — the
# typed request body of an `axonendpoint` populates the parameters of
# its `execute:` flow, a binding the compiler proves TOTAL, the
# runtime delivers on both transports, and the epistemic layer treats
# as `Untrusted` so it reaches a store only as a bound parameter — at
# PR time so the gap report's defect class (a parameterised agent
# flow whose `${param}` interpolates to the literal because the
# request body is discarded) can never regress into a release.
#
# Four parallel lanes:
#
#   1. rust-frontend — the compile-time half: the D2 totality check
#      (`c_2` — an uncovered required parameter is a compile
#      error) + the D2 totality property/fuzz (`g_2` totality).
#
#   2. rust-runtime — the runtime half end-to-end: the diagnostic
#      anchor (37.a), the runtime binding on both transports (37.b),
#      injection-safe `${name}` filter resolution (37.d), honest
#      streaming failure (37.e), the agent-flow E2E (37.f), and the
#      `request_binding` lib unit pack.
#
#   3. fuzz-d3 — the ~4 800-iteration deterministic property pass
#      over `bind_request_body` (total + D4) and `build_pg_where`
#      `${name}` resolution (injection resistance — the clause
#      structure is template-determined, no value text leaks).
#
#   4. regression — D5: the streaming / store / endpoint surfaces
# v1.32.0 touches (v1.24.0/34 streaming, v1.30.0 axonstore
# filter, v1.31.0 dynamic routes) must not regress. The
#      Request Binding Contract is purely additive — every prior
#      wire is byte-identical for a flow that does not error.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── 1. Frontend lane: the compile-time totality theorem ─────────────
  rust-frontend:
    name: Rust frontend — D2 binding totality (v1.32.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axon-frontend/target
          key: ${{ runner.os }}-cargo-request-binding-frontend-${{ hashFiles('axon-frontend/Cargo.lock', 'axon-frontend/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-request-binding-frontend-

      - name: v1.32.0 — endpoint→flow→parameter totality (compile error)
        working-directory: axon-frontend
        run: cargo test --test binding_totality -- --nocapture

      - name: v1.32.0 — D2 totality property/fuzz (800 iters)
        working-directory: axon-frontend
        run: cargo test --test totality_fuzz -- --nocapture

  # ── 2. Runtime lane: the full Request Binding Contract surface ──────
  rust-runtime:
    name: Rust runtime — full v1.32.0 request-binding surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axon-rs/target
          key: ${{ runner.os }}-cargo-request-binding-runtime-${{ hashFiles('axon-rs/Cargo.lock', 'axon-rs/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-request-binding-runtime-

      - name: v1.32.0 — request-binding diagnostic anchor
        working-directory: axon-rs
        run: cargo test --test request_binding_diagnostic -- --nocapture

      - name: v1.32.0 — the runtime binding (SSE + JSON transports)
        working-directory: axon-rs
        run: cargo test --test request_binding -- --nocapture

      - name: v1.32.0 — bind_request_body lib unit pack
        working-directory: axon-rs
        run: cargo test --lib request_binding -- --nocapture

      - name: v1.32.0 — injection-safe ${name} filter resolution
        working-directory: axon-rs
        run: cargo test --test filter_injection -- --nocapture

      - name: v1.32.0 — honest streaming failure (all dialects)
        working-directory: axon-rs
        run: cargo test --test honest_streaming_error -- --nocapture

      - name: v1.32.0 — agent-flow E2E (the full contract)
        working-directory: axon-rs
        run: cargo test --test agent_flow_e2e -- --nocapture

  # ── 3. D3 fuzz lane: the injection-resistance property pass ─────────
  fuzz-d3:
    name: v1.32.0 — request-binding D3 fuzz (~4 800 iters)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axon-rs/target
          key: ${{ runner.os }}-cargo-request-binding-fuzz-${{ hashFiles('axon-rs/Cargo.lock', 'axon-rs/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-request-binding-fuzz-

      - name: v1.32.0 — bind_request_body + build_pg_where fuzz
        working-directory: axon-rs
        run: cargo test --test request_binding_fuzz -- --nocapture

  # ── 4. Regression lane: D5 — no prior surface regresses ─────────────
  #
  # v1.32.0 threads the request body through the streaming dispatcher
  # + the synchronous runner + the filter compiler. D5 is absolute —
  # every v1.24.0/34 streaming wire, every v1.30.0 axonstore filter,
  # every v1.31.0 dynamic route must be preserved.
  regression:
    name: v1.24.0/34/35/36 regression (D5 — v1.32.0 must not regress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axon-rs/target
          key: ${{ runner.os }}-cargo-request-binding-regression-${{ hashFiles('axon-rs/Cargo.lock', 'axon-rs/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-request-binding-regression-

      - name: v1.30.0 axonstore — filter compiler + store fuzz
        working-directory: axon-rs
        run: |
          cargo test --lib store:: -- --nocapture
          cargo test --test axonstore_fuzz -- --nocapture

      - name: v1.24.0/34 streaming dispatcher + wire dialects
        working-directory: axon-rs
        run: |
          cargo test --test stub_steps_executed_anchor -- --nocapture
          cargo test --test default_on_and_tool_call -- --nocapture
          cargo test --test dialect_metadata_population -- --nocapture
          cargo test --test unified_stream_handler_diagnostic -- --nocapture

      - name: v1.31.0 dynamic routes + mixed-flow streaming
        working-directory: axon-rs
        run: |
          cargo test --test dynamic_handler_resolution -- --nocapture
          cargo test --test mixed_flow_streaming -- --nocapture
          cargo test --test data_flow_integrity -- --nocapture
          cargo test --test terminator_fuzz -- --nocapture
