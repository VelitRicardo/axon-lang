name: CI

# v2.0.0 Pure Silicon Cognition. The CI is now
# Rust-canonical: there is no Python language stack to test. The
# gate exercises the three Rust crates (axon-frontend, axon-csys via
# its own workflow, axon-rs) + builds the native binary + validates
# the public CLI contract + runs the 2 Cat 3 subprocess tests that
# anchor the CLI contract against the binary.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Rust-canonical test + native binary build ────────────────────
  rust-native:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: axon-linux-x86_64
            binary_path: axon-rs/target/release/axon
          - os: windows-latest
            artifact_name: axon-windows-x86_64
            binary_path: axon-rs/target/release/axon.exe
          - os: macos-latest
            artifact_name: axon-macos-arm64
            binary_path: axon-rs/target/release/axon

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axon-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('axon-rs/Cargo.lock', 'axon-rs/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # v2.0.0 — the frontend lib carries the lexer / parser /
      # type-checker / IR generator + the FlowEnvelope type system
      # (39.a) + axon-E039 wire-shape gate (39.e). Test it explicitly.
      #
      # v2.81.0 — this step is ALSO where the shop window is gated. Two
      # suites here are build inputs, not unit tests:
      #   - examples_compile.rs  — EVERY examples/**/*.axon compiles.
      # Before v2.81.0 the only example CI ever compiled was
      #     contract_analyzer.axon (see the CLI step below), and 6 of 12 were
      #     broken against the shipped compiler without anything noticing.
      #   - readme_snippets.rs   — every ```axon block in README.md is
      #     compiled, against a checked-in ledger of known-uncompilable blocks
      #     that may only SHRINK. The README is an input to the build.
      # Do not narrow this step to a filtered test list.
      - name: Run cargo test (axon-frontend)
        working-directory: axon-frontend
        run: cargo test --verbose

      - name: Run cargo test (axon-rs)
        working-directory: axon-rs
        run: cargo test --verbose

      # v2.89.0 — the lane that lights the dark targets.
      #
      # `cargo test` above runs the DEFAULT feature set (`cli`). v2.87.0 pinned
      # 104 test targets that compile to ZERO tests under it — 88 behind
      # `server`, 15 behind `postgres`, 1 behind `documents` — and its ratchet
      # says, in its own failure message: *going dark is allowed; going dark
      # SILENTLY is not*, and asks that something actually run them.
      #
      # Nothing did. Not here. For entire cycles the only thing running them was
      # a developer's local `--features server,csys-native`, so CI was green
      # over a subset of the suite while the full run was ~5.6k tests. That is
      # v2.87.0's own finding — "860 tests reporting green without executing" —
      # one level up, in the place nobody had looked.
      #
      # `postgres` is deliberately NOT in this list: those 15 targets need a
      # live database and have their own workflows (fase_37x, the design plan,
      # i_2). This lane covers the 88 + 1 that need only a feature flag.
      - name: Run cargo test (axon-rs, server + csys-native)
        working-directory: axon-rs
        run: cargo test --verbose --features server,csys-native,documents

      - name: Build release binary
        working-directory: axon-rs
        run: cargo build --release

      - name: Validate native CLI (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: axon-rs
        run: |
          ./target/release/axon version
          ./target/release/axon check ../examples/contract_analyzer.axon
          ./target/release/axon compile ../examples/contract_analyzer.axon --stdout > /dev/null
          ./target/release/axon run ../examples/contract_analyzer.axon --tool-mode stub
          ./target/release/axon trace ../examples/sample.trace.json --no-color
          ./target/release/axon parse ../examples/contract_analyzer.axon
          ./target/release/axon fmt ../examples/contract_analyzer.axon > /dev/null
          ./target/release/axon inspect anchors
          echo '.quit' | ./target/release/axon repl

      - name: Validate native CLI (Windows)
        if: runner.os == 'Windows'
        working-directory: axon-rs
        shell: pwsh
        run: |
          .\target\release\axon.exe version
          .\target\release\axon.exe check ..\examples\contract_analyzer.axon
          .\target\release\axon.exe compile ..\examples\contract_analyzer.axon --stdout | Out-Null
          .\target\release\axon.exe run ..\examples\contract_analyzer.axon --tool-mode stub
          .\target\release\axon.exe trace ..\examples\sample.trace.json --no-color
          .\target\release\axon.exe parse ..\examples\contract_analyzer.axon
          .\target\release\axon.exe fmt ..\examples\contract_analyzer.axon | Out-Null
          .\target\release\axon.exe inspect anchors

      - name: Upload native binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error

  # ── Cat 3 CLI contract tests (subprocess against the binary) ──────
  # v2.0.0 — the 2 surviving Python tests anchor the public CLI
  # contract. They subprocess-invoke the native binary (no Python
  # language runtime). Run on Linux only (the contract is platform-
  # agnostic; the rust-native job already validates the binary on
  # all 3 OSes).
  cli-contract:
    runs-on: ubuntu-latest
    needs: [rust-native]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axon-rs/target
          key: ubuntu-latest-cargo-${{ hashFiles('axon-rs/Cargo.lock') }}
          restore-keys: ubuntu-latest-cargo-

      - name: Build the native binary
        working-directory: axon-rs
        run: cargo build

      # v2.89.0 — was `pytest tests/test_cli_mvp_smoke.py
      # tests/test_frontend_contract_golden.py`. Both files were DELETED by
      # v2.77.0 ("retire the PyPI distribution shim — 5 of 6 .py files gone")
      # and this step was not updated, so the job has failed on every push
      # since.
      #
      # It failed quietly, in a lane nobody watches — and it took the GitHub
      # Releases with it: the `release` job below declares
      # `needs: [rust-native, cli-contract]`, so a red cli-contract meant no
      # Release was ever created. That is why the newest Release on the repo
      # was v2.75.0 while the tags ran to v2.88.0. Nobody connected a deleted
      # Python file to a missing releases page.
      #
      # The coverage was never lost. `cli_binary_parity` was written to
      # replicate that exact harness — it subprocess-invokes the built binary
      # across all eight plan-vivo commands — and it asserts the version
      # against `axon::runner::AXON_VERSION` rather than a literal, so it can
      # never go stale the way the Python assert did.
      - name: Run the CLI contract against the native binary
        working-directory: axon-rs
        run: cargo test --test cli_binary_parity -- --nocapture

  # ── Release ───────────────────────────────────────────────────────
  # Triggered only on version tags (v*). Downloads native binaries
  # from rust-native and creates a GitHub Release with platform
  # binaries attached.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust-native, cli-contract]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cd release-artifacts
          if [ -d axon-linux-x86_64 ]; then
            chmod +x axon-linux-x86_64/axon
            tar czf ../release-assets/axon-linux-x86_64.tar.gz -C axon-linux-x86_64 axon
          fi
          if [ -d axon-macos-arm64 ]; then
            chmod +x axon-macos-arm64/axon
            tar czf ../release-assets/axon-macos-arm64.tar.gz -C axon-macos-arm64 axon
          fi
          if [ -d axon-windows-x86_64 ]; then
            (cd axon-windows-x86_64 && zip ../../release-assets/axon-windows-x86_64.zip axon.exe)
          fi
          ls -la ../release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
