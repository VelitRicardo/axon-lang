[package]
name = "axon-frontend"
version = "3.4.0"
edition = "2021"
rust-version = "1.95"
authors = ["AXON Project", "Ricardo Velit"]
description = "AXON compiler frontend - lexer, parser, AST, epistemic type system, type checker, IR generator. Zero runtime dependencies. Ships the two judgments the runtime shares verbatim: `stability` (the `mandate` gain band D < |Kp+Ki+Kd| < 1/L, both endpoints exclusive, verified at compile time against declared bounds) and `substrate` (the `fabric` provider/region/jurisdiction catalog behind axon-E041 region mismatch and axon-E042 compliance-jurisdiction). It also accepts the step-body statement positions the language reference has always published: mandate/shield/ots/lambda applications scoped to the step they govern, the PIX verbs with a braceless field list, and `hibernate until <event>`. axon-T957 RegulatedBoundaryCoverage and axon-T1215 channel κ-coverage guard every regulated boundary. See https://www.ricardovelit.com/axon-docs"
license = "AGPL-3.0-or-later"
repository = "https://github.com/VelitRicardo/axon-lang"
# The canonical documentation host. Until 2.83.0 BOTH
# fields were absent, so the crates.io page showed no documentation link at
# all: an adopter landing there had nowhere to go but the README.
homepage = "https://www.ricardovelit.com/axon-docs"
documentation = "https://www.ricardovelit.com/axon-docs"
readme = "README.md"
keywords = ["axon", "compiler", "parser", "ast", "type-checker"]
categories = ["compilers", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ─── target/ bloat control (disk hygiene, same as axon-rs) ───────────
# debug=1 (line-tables) for our code; strip debug info from third-party deps.
# Profiles apply only to the build ROOT → ignored by downstream consumers.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0
