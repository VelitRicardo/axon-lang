[package]
name = "axon-frontend"
version = "1.59.0"
edition = "2021"
rust-version = "1.95"
authors = ["AXON Project", "Ricardo Velit"]
description = "AXON compiler frontend — lexer, parser, AST, epistemic type system, type checker, IR generator. Zero runtime dependencies. v1.59.0 (§Fase 119) adds the two judgments the runtime shares verbatim — `stability` (the `mandate` gain band `D < |Kp+Ki+Kd| < 1/L`, both endpoints exclusive) and `substrate` (the `fabric` provider/region/jurisdiction catalog behind axon-E041 and axon-E042) — plus the step-body statement positions the language reference has always published: `mandate`/`shield`/`ots`/`lambda` applications, the PIX verbs with a braceless field list, and `hibernate until <event>`. v1.58.0 added axon-T957 RegulatedBoundaryCoverage: the ESK Fase 6.1 kappa-coverage law scoped to `axonendpoint` — an endpoint whose `body:`/`output:` types carry regulatory classes must name a `shield:` covering them (a real set difference, not a presence check). v1.3.0 lowers requires_capabilities into IRAxonEndpoint (the PCC capability-containment property, §Fase 51.x.1). v1.2.0 added PRIMITIVE_REGISTRY — closed catalogue of every named language construct (45 entries) with PrimitiveInfo / DocStatus / CoverageSummary types + helpers. v1.1.0 introduced session-types + multiparty projection. See https://github.com/VelitRicardo/axon-lang."
license = "AGPL-3.0-or-later"
repository = "https://github.com/VelitRicardo/axon-lang"
# §Fase 119.g — D119.2 named the canonical documentation host. Until now BOTH
# fields were absent, so the crates.io page showed no documentation link at
# all: an adopter landing there had nowhere to go but the README.
homepage = "https://www.ricardovelit.com/axon-docs"
documentation = "https://www.ricardovelit.com/axon-docs"
readme = "README.md"
keywords = ["axon", "compiler", "parser", "ast", "type-checker"]
categories = ["compilers", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ─── target/ bloat control (disk hygiene, same as axon-rs) ───────────
# debug=1 (line-tables) for our code; strip debug info from third-party deps.
# Profiles apply only to the build ROOT → ignored by downstream consumers.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0
