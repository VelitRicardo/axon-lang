# ── ML-DSA-65 (FIPS 204) + the module's entropy source ────────────────────────
#
# Same upstream, same pinned commit as fips202 above. The scheme directory
# carries its own LICENSE (CC0 public domain), vendored alongside the code —
# a provenance claim without its license text is half a claim.
#
# randombytes.{c,h} come from PQClean's common/: keypair generation and
# FIPS 204's default hedged signing consume OS randomness, and the entropy
# source is PART of a cryptographic module, not something injected across its
# boundary. On Windows it uses the classic CryptoAPI (CryptAcquireContextA /
# CryptGenRandom), which is why the build links advapi32 there — established
# from the linker's unresolved-symbol list, after a first draft of this note
# claimed BCrypt and was wrong.
#
# All ML-DSA symbols are prefixed (PQCLEAN_MLDSA65_CLEAN_*) — unlike
# fips202's bare shake256, these cannot collide with anything.
