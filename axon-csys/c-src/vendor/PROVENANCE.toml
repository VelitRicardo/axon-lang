[[upstream]]
name = "orlp/ed25519"
repository = "https://github.com/orlp/ed25519"
commit = "b1f19fab4aebe607805620d25a5e42566ce46a0e"
imported = "2026-08-17"
license = "zlib"
# license.txt vendored alongside. Clause 2 of zlib requires altered versions to
# be plainly marked; this import satisfies it structurally — the provenance gate
# refuses alteration outright, so there is never an altered version to mark.
license_note = "zlib; ref10 (SUPERCOP) lineage — the same family fips202.c's header cites."
why = """
Ed25519 + its internal SHA-512 — the CLASSICAL half of the hybrid evidence
signature (Ed25519 ‖ ML-DSA-65). Chosen over larger libraries because it is
single-purpose: only the signing path enters the module boundary. seed.c
(OS entropy) is deliberately NOT vendored — seeds come from the module's own
randombytes — and add_scalar.c / key_exchange.c (X25519) are out of scope.

API conventions that differ from PQClean, established by reading the source:
ed25519_verify returns 1=valid / 0=invalid (PQClean: 0=ok); the private key is
the 64-byte expanded form, not the 32-byte RFC 8032 seed; signing requires the
public key as an argument. The Rust shim normalises all three.
"""
